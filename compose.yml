  #     - ./gcp_sa.json:/app/gcp_sa.json:ro,z
  #   depends_on:
  #     db:
  #       condition: service_healthy
  db:
    image: postgres:alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d local -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/18/docker

volumes:
  pgdata:
